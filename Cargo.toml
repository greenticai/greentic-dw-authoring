[package]
name = "greentic-dw-authoring"
version = "0.1.1"
edition = "2021"
rust-version = "1.95.0"
description = "Author agentic-worker packs (single_turn / agent_graph / deep_worker) from a WorkerSpec"
license = "Apache-2.0"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Read/write `sbom.cbor` in `seal`. Same crate greentic-pack-lib and
# greentic-designer already use for pack CBOR, so this adds no new lineage.
serde_cbor = "0.11"
serde_yaml_bw = "2"
schemars = "0.8"
anyhow = "1"
thiserror = "2"
blake3 = "1"
time = { version = "0.3", features = ["formatting"] }
semver = "1"
greentic-types = "=1.3.0-research.1"
greentic-pack-lib = "=1.3.0-research.13"
greentic-flow = "=1.3.0-research.5"
greentic-extension-sdk-contract = "=1.3.0-research.5"
greentic-aw-runtime = { git = "https://github.com/greenticai/greentic-runner", rev = "85d040b8d56b7d852a6835447f10f23e1f51447c", features = ["test-mock"] }
zip = "2"

[dev-dependencies]
tempfile = "3"

[patch.crates-io]
# Research-line chain (greentic-start#595): greentic-runner 85d040b8 =-pins
# these, each develop's code under a never-published research-line number, so
# they exist only in git while crates.io publishing is locked. greentic-pack-lib
# and greentic-flow above must name the same versions, or cargo ignores the
# patch and the registry copy wins.
# TO UNWIND once publishing is restored: delete these lines, `cargo update`.
greentic-flow = { git = "https://github.com/greenticai/greentic-flow", rev = "348cceb857034ad6533905d747328dca13c1b610" }
greentic-pack-lib = { git = "https://github.com/greenticai/greentic-pack", rev = "46851ce1477c4b440aad7f7e3032260d63f85109" }
greentic-distributor-client = { git = "https://github.com/greenticai/greentic-distributor-client", rev = "d594bb896c9722f439bf3c0cb98a3b85afb9b540" }
greentic-secrets-lib = { git = "https://github.com/greenticai/greentic-secrets", rev = "633934c31a4d0413885bbced87acbc29a03c7b28" }
greentic-secrets-spec = { git = "https://github.com/greenticai/greentic-secrets", rev = "633934c31a4d0413885bbced87acbc29a03c7b28" }
greentic-mcp-exec = { git = "https://github.com/greenticai/greentic-mcp.git", rev = "a4ad9e4ef8f6a6ff0496e2d3dfa2de9e35f84adc" }
greentic-extension-sdk-contract = { git = "https://github.com/greenticai/greentic-designer-sdk.git", tag = "v1.3.0-research.5" }
# greentic-ext-runtime now reuses sdk-registry's TOFU publisher-key store, so
# -registry joins the graph transitively. It is not on crates.io, so it needs
# the same tag redirect -contract and -state already had. Keep all three on ONE
# tag: they are `=`-pinned to each other, so a split resolves two instances.
greentic-extension-sdk-registry = { git = "https://github.com/greenticai/greentic-designer-sdk.git", tag = "v1.3.0-research.5" }
greentic-extension-sdk-state = { git = "https://github.com/greenticai/greentic-designer-sdk.git", tag = "v1.3.0-research.5" }
greentic-i18n-cards = { git = "https://github.com/greenticai/greentic-i18n.git", rev = "1eb3569416830b146758ca873a409e1513c0939b" }
