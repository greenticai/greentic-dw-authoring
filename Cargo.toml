[package]
name = "greentic-dw-authoring"
version = "1.2.0-dev.0"
edition = "2021"
rust-version = "1.95.0"
description = "Author agentic-worker packs (single_turn / agent_graph / deep_worker) from a WorkerSpec"
license = "Apache-2.0"
repository = "https://github.com/greenticai/greentic-dw-authoring"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Read/write `sbom.cbor` in `seal`. Same crate greentic-pack-lib and
# greentic-designer already use for pack CBOR, so this adds no new lineage.
serde_cbor = "0.11"
serde_yaml_bw = "2"
schemars = "0.8"
anyhow = "1"
thiserror = "2"
blake3 = "1"
time = { version = "0.3", features = ["formatting"] }
semver = "1"
greentic-types = ">=1.2.0-dev, <1.3.0-0"
greentic-pack-lib = ">=1.2.0-dev, <1.3.0-0"
greentic-flow = ">=1.2.0-dev, <1.3.0-0"
greentic-extension-sdk-contract = ">=1.2.24-dev, <1.2.25"
greentic-aw-runtime = { version = ">=1.2.0-dev, <1.3.0-0", features = ["test-mock"] }
zip = "2"

[dev-dependencies]
tempfile = "3"
